<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <canvas id="rain_canvas"></canvas>
        <div class="app">
            <h1>Siwatko Clicker</h1>
            <input type="file" id="coin_upload" accept="image/*" style="display:none">
            <button onclick="document.getElementById('coin_upload').click()">Change Coin Image</button>

            <button onclick="toggleAchievements()">🏅 Achievements</button>
            <div id="achievements_panel" class="achievements_panel"></div>
            
            <div class="game">
                <div class="cookie_window">
                    <a class="counter_text" id="counter_text">X Victors</a>
                    <a class="rate_text">1 victor per second</a>
                    <div class="cookie_container">
                        <button class="cookie_button" id="cookie_button"></button>
                    </div>
                </div>
                <div class="farms_section" id="farms_section"></div>
                <div class="upgrades_window" id="upgrades_window"></div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
